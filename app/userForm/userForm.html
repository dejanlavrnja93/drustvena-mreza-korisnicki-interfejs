<!DOCTYPE html>
<html lang="sr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dodavanje i izmena korisnika</title>
        <link rel="stylesheet" href="../../dist/userForm/userForm.css">
        <script src="userForm.js" defer></script>
    </head>
    <body>
        <nav class="navbar">
            <a class="navbar-brand" href="../index.html">Drustvena mreža</a>

            <div class="navbar-links">
                <a href="../index.html">Pregled korisnika</a>
                <a href="../groups/groups.html">Pregled grupa</a>
            </div>
        </nav>

        <h1 id="form-title">Dodavanje korisnika</h1>

        <form id="user-form">
            <label for="korisnickoIme">Korisničko ime:</label>
            <input id="korisnickoIme" name="korisnickoIme" type="text" required>

            <label for="ime">Ime:</label>
            <input id="ime" name="ime" type="text" required>

            <label for="prezime">Prezime:</label>
            <input id="prezime" name="prezime" type="text" required>

            <label for="datumRodjenja">Datum rođenja:</label>
            <input id="datumRodjenja" name="datumRodjenja" type="date" required>

            <p id="form-error" role="alert"></p>

            <div class="form-actions">
                <button type="submit">Sacuvaj korisnika</button>
                <button id="cancelBtn" type="button">Odustani</button>
            </div>
        </form>
    </body>
